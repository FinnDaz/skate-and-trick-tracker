<!DOCTYPE html>



<html>



<head>



  <title>Skate Tracker</title>



  <style>



    body {



      font-family: Arial;



      background: linear-gradient(135deg, #0a0a0a, #000);



      color: white;



      margin: 0;



    }



    h1 {



      text-align: center;



      padding: 20px 0 5px;



    }



    .subtitle {



      text-align: center;



      color: #888;



      margin-bottom: 10px;



    }



    .container {



      max-width: 500px;



      margin: auto;



      padding: 15px;



    }



    .inputBox {



      display: flex;



      gap: 10px;



      margin-bottom: 15px;



    }



    input {



      flex: 1;



      padding: 12px;



      border-radius: 12px;



      border: none;



      outline: none;



    }



    .add {



      padding: 12px 14px;



      border-radius: 12px;



      border: none;



      background: #00ffcc;



      font-weight: bold;



      cursor: pointer;



    }



    .board {



      text-align: center;



      margin: 10px 0 20px;



      color: #00ffcc;



      font-weight: bold;



    }



    .trick {



      background: #151515;



      margin: 12px 0;



      padding: 15px;



      border-radius: 16px;



    }



    .rank {



      color: #00ffcc;



      font-weight: bold;



      margin-bottom: 5px;



    }



    .stats {



      font-size: 14px;



      color: #ccc;



      margin-bottom: 10px;



      line-height: 1.6;



    }



    .buttons {



      display: flex;



      gap: 8px;



      margin-bottom: 10px;



    }



    button.action {



      flex: 1;



      padding: 10px;



      border-radius: 10px;



      border: none;



      font-weight: bold;



      cursor: pointer;



    }



    .land { background: #00c853; color: white; }



    .miss { background: #d50000; color: white; }



    .videoBox {



      margin-top: 10px;



    }



    video {



      width: 100%;



      border-radius: 12px;



      margin-top: 10px;



    }



    .upload {



      margin-top: 5px;



      font-size: 12px;



      color: #aaa;



    }



  </style>



</head>



<body>



<h1>🛹 Skate Tracker</h1>



<div class="subtitle">Track tricks • build streaks • save clips</div>



<div class="container">



  <div class="inputBox">



    <input id="trickName" placeholder="Enter trick name">



    <button class="add" onclick="addTrick()">Add</button>



  </div>



  <div class="board">🏆 Leaderboard</div>



  <div id="trickList"></div>



</div>



<script>



let tricks = [];



function addTrick() {



  let name = document.getElementById("trickName").value;



  if (!name) return;



  tricks.push({



    name,



    streak: 0,



    best: 0,



    total: 0,



    video: null



  });



  document.getElementById("trickName").value = "";



  render();



}



function land(i) {



  tricks[i].streak++;



  tricks[i].total++;



  if (tricks[i].streak > tricks[i].best) {



    tricks[i].best = tricks[i].streak;



  }



  render();



}



function miss(i) {



  tricks[i].streak = 0;



  render();



}



function addVideo(i, event) {



  let file = event.target.files[0];



  if (!file) return;



  let reader = new FileReader();



  reader.onload = function(e) {



    tricks[i].video = e.target.result;



    render();



  };



  reader.readAsDataURL(file);



}



function render() {



  let list = document.getElementById("trickList");



  list.innerHTML = "";



  let sorted = [...tricks].sort((a, b) => b.best - a.best);



  sorted.forEach((t, index) => {



    list.innerHTML += `



      <div class="trick">



        <div class="rank">#${index + 1} Rank</div>



        <h2>${t.name}</h2>



        <div class="stats">



          🔥 Streak: ${t.streak}<br>



          🏆 Best: ${t.best}<br>



          📊 Total: ${t.total}



        </div>



        <div class="buttons">



          <button class="action land" onclick="land(${tricks.indexOf(t)})">Landed</button>



          <button class="action miss" onclick="miss(${tricks.indexOf(t)})">Missed</button>



        </div>



        <div class="videoBox">



          <input type="file" accept="video/*" onchange="addVideo(${tricks.indexOf(t)}, event)">



          <div class="upload">Add your clip</div>



          ${t.video ? `<video controls src="${t.video}"></video>` : ""}



        </div>



      </div>



    `;



  });



}



render();



</script>



</body>



</html>
