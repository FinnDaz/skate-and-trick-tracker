<!DOCTYPE html>



<html>



<head>



  <title>Skate Tracker</title>



  <style>



    body {



      font-family: Arial;



      background: #0b0b0b;



      color: white;



      margin: 0;



      text-align: center;



    }



    .box {



      max-width: 400px;



      margin: 60px auto;



      padding: 20px;



      background: #171717;



      border-radius: 12px;



    }



    input, button {



      width: 100%;



      padding: 12px;



      margin: 6px 0;



      border-radius: 10px;



      border: none;



    }



    button {



      background: #00ffcc;



      font-weight: bold;



      cursor: pointer;



    }



    .hidden { display: none; }



    .topbar {



      display: flex;



      justify-content: space-between;



      padding: 10px;



      background: #111;



    }



    .content {



      max-width: 520px;



      margin: auto;



      padding: 15px;



    }



    .card {



      background: #1c1c1c;



      margin: 12px 0;



      padding: 15px;



      border-radius: 12px;



      text-align: left;



    }



    .rank {



      color: #00ffcc;



      font-weight: bold;



    }



    .stats {



      color: #ccc;



      font-size: 14px;



      margin-top: 5px;



      line-height: 1.4;



    }



    .btnRow {



      display: flex;



      gap: 8px;



      margin-top: 10px;



    }



    .land {



      background: #00c853;



      flex: 1;



      padding: 8px;



      border-radius: 8px;



      border: none;



      color: white;



      font-weight: bold;



    }



    .miss {



      background: #d50000;



      flex: 1;



      padding: 8px;



      border-radius: 8px;



      border: none;



      color: white;



      font-weight: bold;



    }



  </style>



</head>



<body>



<!-- LOGIN -->



<div id="authBox" class="box">



  <h2>🛹 Skate Tracker</h2>



  <input id="username" placeholder="Username (signup)">



  <input id="email" placeholder="Email">



  <input id="password" type="password" placeholder="Password">



  <button onclick="signup()">Sign Up</button>



  <button onclick="login()">Login</button>



</div>



<!-- APP -->



<div id="app" class="hidden">



  <div class="topbar">



    <div>🛹 Skate Tracker</div>



    <button onclick="logout()">Logout</button>



  </div>



  <div class="content">



    <h3 id="userInfo">👤 Loading...</h3>



    <input id="trickName" placeholder="Enter trick name">



    <button onclick="addTrick()">Add Trick</button>



    <h3>🏆 Leaderboard</h3>



    <div id="list"></div>



  </div>



</div>



<script type="module">



import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";



import {



  getFirestore,



  collection,



  addDoc,



  onSnapshot,



  doc,



  setDoc,



  getDoc,



  updateDoc



} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



import {



  getAuth,



  createUserWithEmailAndPassword,



  signInWithEmailAndPassword,



  onAuthStateChanged,



  signOut



} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";



/* ELEMENTS */



const authBox = document.getElementById("authBox");



const appDiv = document.getElementById("app");



const userInfo = document.getElementById("userInfo");



const list = document.getElementById("list");



const trickName = document.getElementById("trickName");



const emailInput = document.getElementById("email");



const passwordInput = document.getElementById("password");



const usernameInput = document.getElementById("username");



/* FIREBASE */



const firebaseConfig = {



  apiKey: "AIzaSyAp9kKq_Vlwc8zFcxUltu5673NTY2IE7Nk",



  authDomain: "skate-trick-tracker-e46fe.firebaseapp.com",



  projectId: "skate-trick-tracker-e46fe",



  storageBucket: "skate-trick-tracker-e46fe.firebasestorage.app",



  messagingSenderId: "1098876020979",



  appId: "1:1098876020979:web:395478b7267403da87ef86"



};



const app = initializeApp(firebaseConfig);



const db = getFirestore(app);



const auth = getAuth(app);



const col = collection(db, "tricks");



let username = "User";



let tricks = [];



/* SIGNUP */



window.signup = async () => {



  const cred = await createUserWithEmailAndPassword(



    auth,



    emailInput.value,



    passwordInput.value



  );



  if (usernameInput.value) {



    await setDoc(doc(db, "users", cred.user.uid), {



      username: usernameInput.value



    });



  }



};



/* LOGIN */



window.login = async () => {



  await signInWithEmailAndPassword(



    auth,



    emailInput.value,



    passwordInput.value



  );



};



window.logout = () => signOut(auth);



/* AUTH */



onAuthStateChanged(auth, (user) => {



  if (user) {



    authBox.classList.add("hidden");



    appDiv.classList.remove("hidden");



    loadUsername(user.uid);



    loadTricks();



  } else {



    authBox.classList.remove("hidden");



    appDiv.classList.add("hidden");



  }



});



/* USERNAME */



async function loadUsername(uid) {



  try {



    const snap = await getDoc(doc(db, "users", uid));



    if (snap.exists()) username = snap.data().username;



  } catch {}



  userInfo.innerText = "👤 " + username;



}



/* TRICKS */



function loadTricks() {



  onSnapshot(col, (snap) => {



    tricks = [];



    snap.forEach(d => tricks.push({ id: d.id, ...d.data() }));



    render();



  });



}



/* RENDER */



function render() {



  list.innerHTML = "";



  let sorted = [...tricks].sort((a,b)=>b.best - a.best);



  sorted.forEach((t,i)=>{



    list.innerHTML += `



      <div class="card">



        <div class="rank">#${i+1}</div>



        <h3>${t.name}</h3>



        <div class="stats">



          👤 ${t.user}<br>



          🔥 Streak: ${t.streak}<br>



          🏆 Best: ${t.best}<br>



          📊 Total: ${t.total}



        </div>



        <div class="btnRow">



          <button class="land" onclick="land('${t.id}',${t.streak},${t.best},${t.total})">Landed</button>



          <button class="miss" onclick="miss('${t.id}')">Missed</button>



        </div>



      </div>



    `;



  });



}



/* ACTIONS */



window.addTrick = async () => {



  await addDoc(col, {



    name: trickName.value,



    user: username,



    streak: 0,



    best: 0,



    total: 0



  });



  trickName.value="";



};



window.land = async (id, streak, best, total) => {



  streak++;



  total++;



  if(streak>best) best=streak;



  await updateDoc(doc(db,"tricks",id),{streak,best,total});



};



window.miss = async (id) => {



  await updateDoc(doc(db,"tricks",id),{streak:0});



};



</script>



</body>



</html>
