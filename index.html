<!DOCTYPE html>



<html>



<head>



  <title>Skate Tracker</title>



  <style>



    body {



      font-family: Arial;



      background: #111;



      color: white;



      text-align: center;



      margin: 0;



    }



    h1 {



      margin-top: 20px;



    }



    .container {



      max-width: 500px;



      margin: auto;



      padding: 20px;



    }



    input {



      padding: 10px;



      width: 70%;



      border-radius: 8px;



      border: none;



    }



    button {



      padding: 8px 10px;



      margin: 5px;



      border-radius: 8px;



      border: none;



      cursor: pointer;



      font-weight: bold;



    }



    .add {



      background: #00ffcc;



    }



    .trick {



      background: #222;



      margin: 15px 0;



      padding: 15px;



      border-radius: 12px;



    }



    .land {



      background: #00c853;



      color: white;



    }



    .miss {



      background: #d50000;



      color: white;



    }



    .board {



      margin-top: 20px;



      color: #00ffcc;



    }



  </style>



</head>



<body>



<h1>🛹 Skate Tracker</h1>



<div class="container">



  <input id="trickName" placeholder="Enter trick name">



  <button class="add" onclick="addTrick()">Add Trick</button>



  <div class="board">



    <h2>🏆 Leaderboard (Best Streaks)</h2>



  </div>



  <div id="trickList"></div>



</div>



<script>



let tricks = [];



function addTrick() {



  let name = document.getElementById("trickName").value;



  if (!name) return;



  tricks.push({



    name: name,



    count: 0,



    streak: 0,



    best: 0



  });



  document.getElementById("trickName").value = "";



  render();



}



function landTrick(i) {



  let t = tricks[i];



  t.count++;



  t.streak++;



  if (t.streak > t.best) t.best = t.streak;



  render();



}



function missTrick(i) {



  tricks[i].streak = 0;



  render();



}



function render() {



  let list = document.getElementById("trickList");



  list.innerHTML = "";



  // sort by best streak (leaderboard)



  let sorted = [...tricks].sort((a, b) => b.best - a.best);



  sorted.forEach((t, index) => {



    list.innerHTML += `



      <div class="trick">



        <h2>#${index + 1} ${t.name}</h2>



        <p>🔥 Current Streak: ${t.streak}</p>



        <p>🏆 Best Streak: ${t.best}</p>



        <p>Total Landed: ${t.count}</p>



        <button class="land" onclick="landTrick(${tricks.indexOf(t)})">Landed</button>



        <button class="miss" onclick="missTrick(${tricks.indexOf(t)})">Missed</button>



      </div>



    `;



  });



}



render();



</script>



</body>



</html>
