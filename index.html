<!DOCTYPE html>



<html>



<head>



  <title>Skate Tracker</title>



  <style>



    body {



      font-family: Arial;



      background: #0b0b0b;



      color: white;



      margin: 0;



      text-align: center;



    }



    .box {



      max-width: 400px;



      margin: 60px auto;



      padding: 20px;



      background: #171717;



      border-radius: 12px;



    }



    input {



      width: 100%;



      padding: 12px;



      margin: 8px 0;



      border-radius: 10px;



      border: none;



    }



    button {



      width: 100%;



      padding: 12px;



      margin-top: 8px;



      border-radius: 10px;



      border: none;



      background: #00ffcc;



      font-weight: bold;



      cursor: pointer;



    }



    .hidden { display: none; }



    .card {



      background: #1c1c1c;



      margin: 10px;



      padding: 10px;



      border-radius: 10px;



      text-align: left;



    }



  </style>



</head>



<body>



<div id="authBox" class="box">



  <h2>🛹 Skate Tracker</h2>



  <input id="username" placeholder="Username (signup)">



  <input id="email" placeholder="Email">



  <input id="password" type="password" placeholder="Password">



  <button onclick="signup()">Sign Up</button>



  <button onclick="login()">Login</button>



</div>



<div id="app" class="hidden">



  <h3 id="userInfo">👤 Loading...</h3>



  <input id="trickName" placeholder="Trick name">



  <button onclick="addTrick()">Add Trick</button>



  <h3>🏆 Leaderboard</h3>



  <div id="list"></div>



  <button onclick="logout()">Logout</button>



</div>



<script type="module">



import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";



import {



  getFirestore,



  collection,



  addDoc,



  onSnapshot,



  doc,



  setDoc,



  getDoc



} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



import {



  getAuth,



  createUserWithEmailAndPassword,



  signInWithEmailAndPassword,



  onAuthStateChanged,



  signOut



} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";



const firebaseConfig = {



  apiKey: "AIzaSyAp9kKq_Vlwc8zFcxUltu5673NTY2IE7Nk",



  authDomain: "skate-trick-tracker-e46fe.firebaseapp.com",



  projectId: "skate-trick-tracker-e46fe",



  storageBucket: "skate-trick-tracker-e46fe.firebasestorage.app",



  messagingSenderId: "1098876020979",



  appId: "1:1098876020979:web:395478b7267403da87ef86"



};



const app = initializeApp(firebaseConfig);



const db = getFirestore(app);



const auth = getAuth(app);



const col = collection(db, "tricks");



let username = "User";



/* SIGNUP */



window.signup = async () => {



  const email = emailInput.value;



  const pass = passwordInput.value;



  const user = usernameInput.value;



  const cred = await createUserWithEmailAndPassword(auth, email, pass);



  // try to save username (but don't break if it fails)



  if (user) {



    try {



      await setDoc(doc(db, "users", cred.user.uid), {



        username: user



      });



    } catch (e) {



      console.log("Username save failed", e);



    }



  }



};



/* LOGIN */



window.login = async () => {



  await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);



};



window.logout = () => signOut(auth);



/* AUTH STATE */



onAuthStateChanged(auth, (user) => {



  if (user) {



    authBox.classList.add("hidden");



    app.classList.remove("hidden");



    userInfo.innerText = "👤 Loading...";



    // load username AFTER UI shows



    loadUsername(user.uid);



    loadTricks();



  } else {



    authBox.classList.remove("hidden");



    app.classList.add("hidden");



  }



});



/* SAFE USERNAME LOAD */



async function loadUsername(uid) {



  try {



    const snap = await getDoc(doc(db, "users", uid));



    if (snap.exists()) {



      username = snap.data().username;



    }



  } catch (e) {



    console.log("Username load failed", e);



  }



  userInfo.innerText = "👤 " + username;



}



/* LOAD TRICKS */



function loadTricks() {



  onSnapshot(col, (snap) => {



    list.innerHTML = "";



    let tricks = [];



    snap.forEach(d => {



      tricks.push(d.data());



    });



    tricks.sort((a,b)=>b.streak - a.streak);



    tricks.forEach((t, i) => {



      list.innerHTML += `



        <div class="card">



          #${i+1}<br>



          👤 ${t.user}<br>



          🛹 ${t.name}<br>



          🔥 ${t.streak}



        </div>



      `;



    });



  });



}



/* ADD */



window.addTrick = async () => {



  await addDoc(col, {



    name: trickName.value,



    user: username,



    streak: 0



  });



  trickName.value = "";



};



/* INPUTS */



const emailInput = document.getElementById("email");



const passwordInput = document.getElementById("password");



const usernameInput = document.getElementById("username");



</script>



</body>



</html>
