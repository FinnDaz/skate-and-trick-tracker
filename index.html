<!DOCTYPE html>



<html>



<head>



  <title>Skate Tracker</title>



  <style>



    body {



      font-family: Arial;



      background: #0a0a0a;



      color: white;



      margin: 0;



      text-align: center;



    }



    h1 { margin: 20px 0 5px; }



    .subtitle {



      color: #888;



      margin-bottom: 10px;



    }



    .container {



      max-width: 500px;



      margin: auto;



      padding: 15px;



    }



    .inputBox {



      display: flex;



      gap: 10px;



      margin-bottom: 10px;



    }



    input {



      flex: 1;



      padding: 12px;



      border-radius: 12px;



      border: none;



      outline: none;



    }



    .add {



      background: #00ffcc;



      border: none;



      padding: 12px;



      border-radius: 12px;



      font-weight: bold;



      cursor: pointer;



    }



    .board {



      margin: 10px 0 20px;



      color: #00ffcc;



      font-weight: bold;



    }



    .trick {



      background: #1c1c1c;



      margin: 12px 0;



      padding: 15px;



      border-radius: 14px;



      text-align: left;



    }



    .rank {



      color: #00ffcc;



      font-weight: bold;



    }



    .user {



      color: #aaa;



      font-size: 13px;



      margin-bottom: 5px;



    }



    .stats {



      font-size: 14px;



      color: #ccc;



      line-height: 1.6;



      margin-bottom: 10px;



    }



    button {



      padding: 8px 10px;



      margin: 5px;



      border: none;



      border-radius: 10px;



      font-weight: bold;



      cursor: pointer;



    }



    .land { background: #00c853; color: white; }



    .miss { background: #d50000; color: white; }



    .videoInput {



      width: 100%;



      margin-top: 10px;



    }



    video {



      width: 100%;



      margin-top: 10px;



      border-radius: 10px;



    }



  </style>



</head>



<body>



<h1>🛹 Skate Tracker</h1>



<div class="subtitle">Leaderboard • Usernames • Videos</div>



<div class="container">



  <input id="username" placeholder="Enter your username">



  <br><br>



  <div class="inputBox">



    <input id="trickName" placeholder="Enter trick name">



    <button class="add" onclick="addTrick()">Add</button>



  </div>



  <div class="board">🏆 Leaderboard</div>



  <div id="trickList"></div>



</div>



<script type="module">



import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";



import {



  getFirestore,



  collection,



  addDoc,



  onSnapshot,



  doc,



  updateDoc



} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



/* 🔥 YOUR FIREBASE CONFIG */



const firebaseConfig = {



  apiKey: "AIzaSyAp9kKq_Vlwc8zFcxUltu5673NTY2IE7Nk",



  authDomain: "skate-trick-tracker-e46fe.firebaseapp.com",



  projectId: "skate-trick-tracker-e46fe",



  storageBucket: "skate-trick-tracker-e46fe.firebasestorage.app",



  messagingSenderId: "1098876020979",



  appId: "1:1098876020979:web:395478b7267403da87ef86"



};



const app = initializeApp(firebaseConfig);



const db = getFirestore(app);



const col = collection(db, "tricks");



let tricks = [];



let currentUser = "";



document.getElementById("username").addEventListener("input", (e) => {



  currentUser = e.target.value;



});



function render() {



  let list = document.getElementById("trickList");



  list.innerHTML = "";



  let sorted = [...tricks].sort((a, b) => b.best - a.best);



  sorted.forEach((t, index) => {



    list.innerHTML += `



      <div class="trick">



        <div class="rank">#${index + 1}</div>



        <div class="user">👤 ${t.user}</div>



        <h3>${t.name}</h3>



        <div class="stats">



          🔥 Streak: ${t.streak}<br>



          🏆 Best: ${t.best}<br>



          📊 Total: ${t.total}



        </div>



        <button class="land" onclick="land('${t.id}', ${t.streak}, ${t.best}, ${t.total})">Landed</button>



        <button class="miss" onclick="miss('${t.id}')">Missed</button>



        <input class="videoInput" type="file" accept="video/*"



          onchange="addVideo('${t.id}', event)">



        ${t.video ? `<video controls src="${t.video}"></video>` : ""}



      </div>



    `;



  });



}



window.addTrick = async function() {



  let name = document.getElementById("trickName").value;



  if (!name || !currentUser) return;



  await addDoc(col, {



    name,



    user: currentUser,



    streak: 0,



    best: 0,



    total: 0,



    video: ""



  });



  document.getElementById("trickName").value = "";



};



window.land = async function(id, streak, best, total) {



  const ref = doc(db, "tricks", id);



  streak++;



  total++;



  if (streak > best) best = streak;



  await updateDoc(ref, { streak, best, total });



};



window.miss = async function(id) {



  const ref = doc(db, "tricks", id);



  await updateDoc(ref, { streak: 0 });



};



window.addVideo = async function(id, event) {



  const file = event.target.files[0];



  if (!file) return;



  const reader = new FileReader();



  reader.onload = async function(e) {



    const ref = doc(db, "tricks", id);



    await updateDoc(ref, { video: e.target.result });



  };



  reader.readAsDataURL(file);



};



onSnapshot(col, (snap) => {



  tricks = [];



  snap.forEach(d => {



    tricks.push({ id: d.id, ...d.data() });



  });



  render();



});



</script>



</body>



</html>
