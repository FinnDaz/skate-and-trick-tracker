
<!DOCTYPE html>



<html>



<head>



  <title>Skate Tracker</title>



  <style>



    body {



      margin: 0;



      font-family: Arial;



      background: #0b0b0b;



      color: white;



    }



    .app {



      display: flex;



      height: 100vh;



    }



    .sidebar {



      width: 240px;



      background: #151515;



      padding: 10px;



      display: flex;



      flex-direction: column;



      overflow-y: auto;



    }



    .btn {



      width: 100%;



      padding: 10px;



      margin: 5px 0;



      background: #222;



      border: none;



      color: white;



      border-radius: 8px;



      cursor: pointer;



      text-align: left;



    }



    .btn.active {



      background: #00ffcc;



      color: black;



      font-weight: bold;



    }



    .logout {



      margin-top: auto;



      background: #ff4444;



    }



    .main {



      flex: 1;



      padding: 15px;



      overflow-y: auto;



    }



    .card {



      background: #1c1c1c;



      padding: 12px;



      margin: 10px 0;



      border-radius: 10px;



    }



    input, select {



      padding: 8px;



      width: 100%;



      margin: 5px 0;



      border-radius: 6px;



      border: none;



    }



    button.action {



      padding: 6px 10px;



      margin-right: 5px;



      margin-top: 5px;



      border: none;



      border-radius: 6px;



      background: #00ffcc;



      cursor: pointer;



    }



  </style>



</head>



<body>



<!-- AUTH -->



<div id="authBox">



  <h2>🛹 Skate Tracker</h2>



  <input id="username" placeholder="Username">



  <input id="email" placeholder="Email">



  <input id="password" type="password" placeholder="Password">



  <button onclick="signup()">Sign Up</button>



  <button onclick="login()">Login</button>



</div>



<!-- APP -->



<div id="app" class="app" style="display:none;">



  <!-- SIDEBAR -->



  <div class="sidebar">



    <button class="btn" onclick="setView('leaderboard')">🏆 Leaderboard</button>



    <button class="btn" onclick="setView('profile')">👤 Your Profile</button>



    <div id="trickList"></div>



    <hr style="border:1px solid #333;">



    <input id="trickName" placeholder="Add trick">



    <select id="category">



      <option value="Flatground">Flatground</option>



      <option value="Grind">Grind</option>



    </select>



    <select id="difficulty">



      <option value="Beginner">Beginner</option>



      <option value="Intermediate">Intermediate</option>



      <option value="Advanced">Advanced</option>



    </select>



    <button class="btn" onclick="addTrick()">Add Trick</button>



    <button class="btn logout" onclick="logout()">Logout</button>



  </div>



  <!-- MAIN -->



  <div class="main">



    <h2 id="title">🏆 Leaderboard</h2>



    <div id="board"></div>



  </div>



</div>



<script type="module">



import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";



import {



  getFirestore,



  collection,



  addDoc,



  getDocs,



  doc,



  setDoc,



  getDoc,



  updateDoc



} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



import {



  getAuth,



  createUserWithEmailAndPassword,



  signInWithEmailAndPassword,



  onAuthStateChanged,



  signOut



} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";



/* FIREBASE */



const firebaseConfig = {



  apiKey: "AIzaSyAp9kKq_Vlwc8zFcxUltu5673NTY2IE7Nk",



  authDomain: "skate-trick-tracker-e46fe.firebaseapp.com",



  projectId: "skate-trick-tracker-e46fe",



  storageBucket: "skate-trick-tracker-e46fe.firebasestorage.app",



  messagingSenderId: "1098876020979",



  appId: "1:1098876020979:web:395478b7267403da87ef86"



};



const app = initializeApp(firebaseConfig);



const db = getFirestore(app);



const auth = getAuth(app);



/* STATE */



let view = "leaderboard";



let selected = null;



/* AUTH */



window.signup = async () => {



  const cred = await createUserWithEmailAndPassword(auth, email.value, password.value);



  await setDoc(doc(db, "users", cred.user.uid), {



    username: username.value



  });



};



window.login = () => signInWithEmailAndPassword(auth, email.value, password.value);



window.logout = () => signOut(auth);



/* AUTH STATE */



onAuthStateChanged(auth, () => {



  document.getElementById("authBox").style.display = "none";



  document.getElementById("app").style.display = "flex";



  loadTricks();



  loadBoard();



});



/* VIEW */



window.setView = (v) => {



  view = v;



  document.getElementById("title").innerText =



    v === "leaderboard" ? "🏆 Leaderboard" : "👤 Your Profile";



  loadBoard();



};



/* ADD TRICK */



window.addTrick = async () => {



  const user = auth.currentUser;



  await addDoc(collection(db, "users", user.uid, "tricks"), {



    name: trickName.value,



    category: category.value,



    difficulty: difficulty.value,



    lands: 0,



    misses: 0,



    streak: 0,



    best: 0,



    points: 0



  });



  trickName.value = "";



  loadTricks();



};



/* LOAD TRICKS */



async function loadTricks() {



  const user = auth.currentUser;



  const snap = await getDocs(collection(db, "users", user.uid, "tricks"));



  const list = document.getElementById("trickList");



  list.innerHTML = "";



  snap.forEach(t => {



    const b = document.createElement("button");



    b.className = "btn";



    b.innerText = t.data().name;



    b.onclick = () => {



      selected = t.data().name;



      loadBoard();



    };



    list.appendChild(b);



  });



}



/* LOAD BOARD */



async function loadBoard() {



  const usersSnap = await getDocs(collection(db, "users"));



  let users = [];



  for (const u of usersSnap.docs) {



    const uid = u.id;



    const uname = u.data().username;



    const tricksSnap = await getDocs(collection(db, "users", uid, "tricks"));



    let total = 0;



    let tricks = [];



    tricksSnap.forEach(t => {



      const d = t.data();



      if (!selected || d.name === selected) {



        total += d.points || 0;



        tricks.push({ uid, id: t.id, user: uname, ...d });



      }



    });



    if (view === "leaderboard" || uid === auth.currentUser.uid) {



      users.push({ uid, user: uname, total, tricks });



    }



  }



  render(users);



}



/* RENDER */



function render(users) {



  const board = document.getElementById("board");



  board.innerHTML = "";



  users.sort((a,b)=>b.total-a.total);



  users.forEach((u,i)=>{



    board.innerHTML += `



      <div class="card">



        #${i+1} 👤 ${u.user}<br>



        🏆 Total Points: ${u.total}<br><br>



        ${u.tricks.map(t => `



          🛹 ${t.name}<br>



          🔥 Streak: ${t.streak || 0}<br>



          🏅 Best: ${t.best || 0}<br>



          🏁 Lands: ${t.lands || 0}<br>



          ❌ Misses: ${t.misses || 0}<br>



          ⭐ Points: ${t.points || 0}<br>



          ${auth.currentUser?.uid === t.uid ? `



            <button class="action" onclick="land('${t.uid}','${t.id}')">Land</button>



            <button class="action" onclick="miss('${t.uid}','${t.id}')">Miss</button>



          ` : ""}



          <hr>



        `).join("")}



      </div>



    `;



  });



}



/* LAND */



window.land = async (uid, id) => {



  const ref = doc(db, "users", uid, "tricks", id);



  const snap = await getDoc(ref);



  const d = snap.data();



  const newStreak = (d.streak || 0) + 1;



  const addPoints = 1 + newStreak * 2;



  await updateDoc(ref, {



    lands: (d.lands || 0) + 1,



    streak: newStreak,



    best: Math.max(newStreak, d.best || 0),



    points: (d.points || 0) + addPoints



  });



  loadBoard();



};



/* MISS */



window.miss = async (uid, id) => {



  const ref = doc(db, "users", uid, "tricks", id);



  const snap = await getDoc(ref);



  const d = snap.data();



  await updateDoc(ref, {



    misses: (d.misses || 0) + 1,



    streak: 0,



    points: Math.max(0, (d.points || 0) - 1)



  });



  loadBoard();



};



</script>



</body>



</html>
