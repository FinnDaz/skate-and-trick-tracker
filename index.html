<!DOCTYPE html>



<html>



<head>



  <title>Skate Tracker</title>



  <style>



    body {



      font-family: Arial;



      background: linear-gradient(135deg, #1a1a1a, #000);



      color: white;



      text-align: center;



      margin: 0;



    }



    .container {



      max-width: 500px;



      margin: auto;



      padding: 20px;



    }



    input {



      padding: 12px;



      width: 70%;



      border-radius: 8px;



      border: none;



    }



    button {



      padding: 10px;



      margin: 5px;



      border-radius: 8px;



      border: none;



      cursor: pointer;



      font-weight: bold;



    }



    .add-btn { background: #00ffcc; }



    .trick {



      background: #222;



      margin: 15px 0;



      padding: 15px;



      border-radius: 12px;



    }



    .land { background: #00c853; color: white; }



    .miss { background: #d50000; color: white; }



    video {



      width: 100%;



      margin-top: 10px;



      border-radius: 10px;



    }



  </style>



</head>



<body>



<h1>🛹 Skate Tracker</h1>



<div class="container">



  <input id="trickName" placeholder="Enter trick name">



  <button class="add-btn" onclick="addTrick()">Add</button>



  <div id="trickList"></div>



</div>



<script>



let tricks = JSON.parse(localStorage.getItem("tricks")) || [];



function save() {



  localStorage.setItem("tricks", JSON.stringify(tricks));



}



function addTrick() {



  let name = document.getElementById("trickName").value;



  if (!name) return;



  tricks.push({ 



    name: name, 



    count: 0, 



    streak: 0, 



    best: 0,



    video: null



  });



  document.getElementById("trickName").value = "";



  save();



  render();



}



function landTrick(i) {



  let t = tricks[i];



  t.count++;



  t.streak++;



  if (t.streak > t.best) t.best = t.streak;



  save();



  render();



}



function failTrick(i) {



  tricks[i].streak = 0;



  save();



  render();



}



function addVideo(i, event) {



  let file = event.target.files[0];



  if (!file) return;



  let reader = new FileReader();



  reader.onload = function(e) {



    tricks[i].video = e.target.result;



    save();



    render();



  };



  reader.readAsDataURL(file);



}



function render() {



  let list = document.getElementById("trickList");



  list.innerHTML = "";



  tricks.forEach((t, i) => {



    list.innerHTML += `



      <div class="trick">



        <h2>${t.name}</h2>



        <p>Total: ${t.count}</p>



        <p>🔥 Streak: ${t.streak}</p>



        <p>🏆 Best: ${t.best}</p>



        <button class="land" onclick="landTrick(${i})">Landed</button>



        <button class="miss" onclick="failTrick(${i})">Missed</button>



        <br><br>



        <input type="file" accept="video/*" onchange="addVideo(${i}, event)">



        ${t.video ? `<video controls src="${t.video}"></video>` : ""}



      </div>



    `;



  });



}



render();



</script>



</body>



</html>
