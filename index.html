<!DOCTYPE html>



<html>



<head>



  <title>Skate Tracker</title>



  <style>



    body {



      font-family: Arial;



      background: #0a0a0a;



      color: white;



      margin: 0;



      text-align: center;



    }



    h1 { margin: 20px 0; }



    .container {



      max-width: 500px;



      margin: auto;



      padding: 15px;



    }



    input {



      width: 100%;



      padding: 12px;



      margin: 5px 0;



      border-radius: 10px;



      border: none;



    }



    button {



      width: 100%;



      padding: 12px;



      margin-top: 5px;



      border: none;



      border-radius: 10px;



      background: #00ffcc;



      font-weight: bold;



      cursor: pointer;



    }



    .trick {



      background: #1c1c1c;



      margin-top: 10px;



      padding: 10px;



      border-radius: 10px;



      text-align: left;



    }



  </style>



</head>



<body>



<h1>🛹 Skate Tracker</h1>



<div class="container">



  <input id="username" placeholder="Username">



  <input id="trickName" placeholder="Trick name">



  <button onclick="addTrick()">Add Trick</button>



  <div id="list"></div>



</div>



<script type="module">



import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";



import {



  getFirestore,



  collection,



  addDoc,



  onSnapshot



} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



/* 🔥 YOUR FIREBASE */



const firebaseConfig = {



  apiKey: "AIzaSyAp9kKq_Vlwc8zFcxUltu5673NTY2IE7Nk",



  authDomain: "skate-trick-tracker-e46fe.firebaseapp.com",



  projectId: "skate-trick-tracker-e46fe",



  storageBucket: "skate-trick-tracker-e46fe.firebasestorage.app",



  messagingSenderId: "1098876020979",



  appId: "1:1098876020979:web:395478b7267403da87ef86"



};



const app = initializeApp(firebaseConfig);



const db = getFirestore(app);



const col = collection(db, "tricks");



let tricks = [];



window.addTrick = async function () {



  let user = document.getElementById("username").value;



  let name = document.getElementById("trickName").value;



  if (!user || !name) return;



  await addDoc(col, {



    user,



    name,



    streak: 0



  });



  document.getElementById("trickName").value = "";



};



function render() {



  let list = document.getElementById("list");



  list.innerHTML = "";



  tricks.forEach(t => {



    list.innerHTML += `



      <div class="trick">



        👤 ${t.user}<br>



        🛹 ${t.name}<br>



        🔥 ${t.streak}



      </div>



    `;



  });



}



onSnapshot(col, (snap) => {



  tricks = [];



  snap.forEach(d => tricks.push(d.data()));



  render();



});



</script>



</body>



</html>
