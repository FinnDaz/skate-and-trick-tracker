<!DOCTYPE html>



<html>



<head>



  <title>Skate Tracker</title>



  <style>



    body {



      font-family: Arial;



      background: #0b0b0b;



      color: white;



      margin: 0;



      text-align: center;



    }



    .box {



      max-width: 400px;



      margin: 60px auto;



      padding: 20px;



      background: #171717;



      border-radius: 12px;



    }



    input {



      width: 100%;



      padding: 12px;



      margin: 8px 0;



      border-radius: 10px;



      border: none;



    }



    button {



      width: 100%;



      padding: 12px;



      margin-top: 8px;



      border: none;



      border-radius: 10px;



      background: #00ffcc;



      font-weight: bold;



      cursor: pointer;



    }



    .hidden { display: none; }



    .topbar {



      display: flex;



      justify-content: space-between;



      padding: 10px;



      background: #111;



    }



    .content {



      max-width: 520px;



      margin: auto;



      padding: 15px;



    }



    .card {



      background: #1c1c1c;



      margin: 10px 0;



      padding: 12px;



      border-radius: 10px;



      text-align: left;



    }



    .error {



      color: red;



      margin-top: 10px;



    }



  </style>



</head>



<body>



<div id="authBox" class="box">



  <h2>🛹 Skate Tracker</h2>



  <input id="username" placeholder="Username (signup only)">



  <input id="email" placeholder="Email">



  <input id="password" type="password" placeholder="Password">



  <button onclick="signup()">Sign Up</button>



  <button onclick="login()">Login</button>



  <div id="error" class="error"></div>



</div>



<div id="app" class="hidden">



  <div class="topbar">



    <div>🛹 Skate Tracker</div>



    <button onclick="logout()">Logout</button>



  </div>



  <div class="content">



    <h3 id="userInfo"></h3>



    <input id="trickName" placeholder="Trick name">



    <button onclick="addTrick()">Add Trick</button>



    <div id="list"></div>



  </div>



</div>



<script type="module">



import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";



import {



  getFirestore,



  collection,



  addDoc,



  onSnapshot,



  doc,



  setDoc,



  getDoc



} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



import {



  getAuth,



  createUserWithEmailAndPassword,



  signInWithEmailAndPassword,



  onAuthStateChanged,



  signOut



} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";



const firebaseConfig = {



  apiKey: "AIzaSyAp9kKq_Vlwc8zFcxUltu5673NTY2IE7Nk",



  authDomain: "skate-trick-tracker-e46fe.firebaseapp.com",



  projectId: "skate-trick-tracker-e46fe",



  storageBucket: "skate-trick-tracker-e46fe.firebasestorage.app",



  messagingSenderId: "1098876020979",



  appId: "1:1098876020979:web:395478b7267403da87ef86"



};



const app = initializeApp(firebaseConfig);



const db = getFirestore(app);



const auth = getAuth(app);



const col = collection(db, "tricks");



let currentUser = null;



let username = "";



/* ERROR HANDLER */



function showError(msg) {



  document.getElementById("error").innerText = msg;



}



/* SIGNUP */



window.signup = async () => {



  try {



    const email = emailInput.value;



    const pass = password.value;



    const user = usernameInput.value;



    if (!user) return showError("Enter username");



    const cred = await createUserWithEmailAndPassword(auth, email, pass);



    await setDoc(doc(db, "users", cred.user.uid), {



      username: user



    });



    showError("");



  } catch (e) {



    showError(e.message);



  }



};



/* LOGIN */



window.login = async () => {



  try {



    await signInWithEmailAndPassword(auth, emailInput.value, password.value);



    showError("");



  } catch (e) {



    showError(e.message);



  }



};



window.logout = () => signOut(auth);



/* AUTH STATE */



onAuthStateChanged(auth, async (user) => {



  if (user) {



    currentUser = user;



    authBox.classList.add("hidden");



    app.classList.remove("hidden");



    try {



      const snap = await getDoc(doc(db, "users", user.uid));



      username = snap.exists() ? snap.data().username : "User";



    } catch {



      username = "User";



    }



    userInfo.innerText = "👤 " + username;



    loadTricks();



  } else {



    authBox.classList.remove("hidden");



    app.classList.add("hidden");



  }



});



/* LOAD */



function loadTricks() {



  onSnapshot(col, (snap) => {



    list.innerHTML = "";



    snap.forEach(d => {



      let t = d.data();



      list.innerHTML += `



        <div class="card">



          👤 ${t.user}<br>



          🛹 ${t.name}<br>



          🔥 ${t.streak}



        </div>



      `;



    });



  });



}



/* ADD */



window.addTrick = async () => {



  if (!currentUser) return;



  await addDoc(col, {



    name: trickName.value,



    user: username,



    streak: 0



  });



  trickName.value = "";



};



/* INPUT SHORTCUTS */



const emailInput = document.getElementById("email");



const usernameInput = document.getElementById("username");



</script>



</body>



</html>
